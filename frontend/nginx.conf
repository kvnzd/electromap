# nginx para la aplicación React (una sola página).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas como /en-vivo o /alarmas no son archivos: se entrega index.html y React decide.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos compilados (llevan un código en el nombre): se pueden guardar en caché mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
